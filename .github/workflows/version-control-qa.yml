name: Gradebook quality checks

on:
  push:
    paths:
      - "Version Control, Continuous Integration, and Quality Assurance/**"
      - ".github/workflows/version-control-qa.yml"
  pull_request:
    paths:
      - "Version Control, Continuous Integration, and Quality Assurance/**"
      - ".github/workflows/version-control-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Version Control, Continuous Integration, and Quality Assurance
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Version Control, Continuous Integration, and Quality Assurance/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build check
        run: npm run build
